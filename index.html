<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <!-- タイトル -->
    <title>未経験からのWebエンジニア転職スクール｜ポテパンキャンプ </title>
    <!-- リンク -->
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <!-- ファビコン -->
    <link rel="icon" href="./img/potepancampfavicon32.ico" sizes="32x32">
    <link rel="icon" href="./img/potepancampfavicon16.ico" sizes="16x16">
    <!-- フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <!-- ビューポート -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <!-- ヘッダー -->
    <header>
        <div class="header-list">
            <!-- パソコン用ロゴ -->
            <img src="./img/header-logo.png" alt="ポテパンキャンプ" class="pc header_img">
            <!-- スマホ用ロゴ -->
            <img src="./img/header-logo-sp.png" alt="ポテパンキャンプ" class="sp header_img">


            <nav>
                <!-- ナビリスト -->
                <div class="nav-list">
                    <ul class="nav-ul">
                        <li class="nav-li"><a href="#"><span>CONTENT</span><span>学習内容</span></a></li>
                        <li class="nav-li"><a href="#"><span>INTERVIEW</span><span>受講生の声</span></a></li>
                        <li class="nav-li"><a href="#"><span>FAQ</span><span>よくある質問</span></a></li>
                        <li class="nav-li"><a href="#"><span>RECRUIT</span><span>採用企業様へ</span></a></li>
                        <li class="nav-li"><a href="#"><span>U29</span><span>29歳以下の方へ</span></a></li>
                        <li class="nav-li-btn"><a href="#">無料カウンセリング</a></li>
                    </ul>

                </div>
            </nav>
            <!-- ハンバーガーメニュー -->
            <button class="hamburger" type="button">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>
        <!-- ヒーローイメージ -->
        <section class="hero_img">
            <!-- PC用イメージ -->
            <div class="pc">
                <img src="./img/left-rectangle.svg" alt="左三角" width="348" height="348"
                    class="hero_img_ab hero_img_left">
                <img src="img/fill-rectangle.svg" alt="丸" class="hero_img_ab hero_img_maru">
                <img src="img/main-visual.webp" alt="人" width="775" class="hero_img_ab hero_img_main">
                <img src="img/right-rectangle.svg" alt="右三角" width="348" height="348"
                    class="hero_img_ab hero_img_right">
            </div>
            <!-- スマホ用イメージ -->
            <div class="sp">
                <img src="./img/whole-visual.webp" alt="sp人" class="hero_sp">
            </div>
            <div class="hero_text_box">
                <div class="hero_text_re">
                    <h2 class="hero_text">
                        実践的カリキュラムと<br>
                        豊富な提携求人で<br>
                        確実にITエンジニアへ
                        <img src="./img/badge.svg" alt="N1" class="hero_text_ab" width="204" height="204">
                    </h2>

                    <p class="hero_btn"><a href="#">まずは無料カウンセリングへ</a></p>
                    <p class="comento">
                        ※ショッパーズアイ「プログラミングスクール10社を対象にしたサイト比較イメージ調査<br>
                        （2020 年 5 月 22 日～25 日）」より全国の22～49歳の男女691名へのインターネット調査
                    </p>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
